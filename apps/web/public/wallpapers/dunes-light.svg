<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3eeed"/>
      <stop offset="0.42" stop-color="#eef1ec"/>
      <stop offset="0.62" stop-color="#f4efe5"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </linearGradient>
    <radialGradient id="sun" cx="1390" cy="420" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8ea" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fbefdc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbefdc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="260" cy="120" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfe4e2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#cfe4e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2df"/>
      <stop offset="1" stop-color="#e6ece6"/>
    </linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eae3d5"/>
      <stop offset="1" stop-color="#e0d6c4"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6dccb"/>
      <stop offset="1" stop-color="#d7cab4"/>
    </linearGradient>
    <linearGradient id="d3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d6c1"/>
      <stop offset="1" stop-color="#cfbfa5"/>
    </linearGradient>
    <linearGradient id="d4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dccdb4"/>
      <stop offset="1" stop-color="#c8b597"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2ea" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f6f2ea" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6f2ea" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#sky)"/>
  <rect width="1920" height="1200" fill="url(#mist)"/>
  <rect width="1920" height="1200" fill="url(#sun)"/>

  <!-- Lagoon on the horizon -->
  <path d="M0 640 C 380 622 760 616 1120 624 C 1460 632 1720 626 1920 618 L1920 760 L0 760 Z" fill="url(#water)"/>
  <path d="M0 668 C 520 660 1100 664 1920 652" stroke="#f8fbf8" stroke-opacity="0.7" stroke-width="3" fill="none" filter="url(#soft)"/>

  <!-- Dunes, far to near -->
  <path d="M0 720 C 240 668 470 650 720 676 C 930 698 1080 662 1300 640 C 1540 616 1760 646 1920 680 L1920 1200 L0 1200 Z" fill="url(#d1)"/>
  <rect y="640" width="1920" height="140" fill="url(#haze)"/>
  <path d="M0 820 C 300 760 560 730 860 770 C 1100 802 1300 760 1520 736 C 1700 718 1830 742 1920 766 L1920 1200 L0 1200 Z" fill="url(#d2)"/>
  <path d="M0 930 C 260 880 520 852 760 880 C 1040 912 1260 860 1520 846 C 1720 836 1840 868 1920 892 L1920 1200 L0 1200 Z" fill="url(#d3)"/>
  <path d="M760 880 C 1040 912 1260 860 1520 846" stroke="#f3ebdc" stroke-opacity="0.8" stroke-width="2" fill="none"/>
  <path d="M0 1060 C 320 1000 640 984 940 1016 C 1240 1048 1520 1000 1920 990 L1920 1200 L0 1200 Z" fill="url(#d4)"/>
  <path d="M0 1060 C 320 1000 640 984 940 1016" stroke="#ede2cf" stroke-opacity="0.7" stroke-width="2" fill="none"/>
</svg>
