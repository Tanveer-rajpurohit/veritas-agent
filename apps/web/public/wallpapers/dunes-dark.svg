<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1113"/>
      <stop offset="0.55" stop-color="#0f1618"/>
      <stop offset="1" stop-color="#0c0f10"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="80" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c3a3b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1c3a3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="1420" cy="380" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3326" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a3326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14292a"/>
      <stop offset="1" stop-color="#101819"/>
    </linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b1d"/>
      <stop offset="1" stop-color="#121719"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181f21"/>
      <stop offset="1" stop-color="#13191a"/>
    </linearGradient>
    <linearGradient id="d3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2325"/>
      <stop offset="1" stop-color="#151b1c"/>
    </linearGradient>
    <linearGradient id="d4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20282a"/>
      <stop offset="1" stop-color="#171d1e"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#sky)"/>
  <rect width="1920" height="1200" fill="url(#glow)"/>
  <rect width="1920" height="1200" fill="url(#moon)"/>
  <circle cx="1420" cy="380" r="34" fill="#d9cdb3" fill-opacity="0.18"/>

  <!-- Lagoon on the horizon -->
  <path d="M0 640 C 380 622 760 616 1120 624 C 1460 632 1720 626 1920 618 L1920 760 L0 760 Z" fill="url(#water)"/>
  <path d="M1250 650 C 1380 646 1460 646 1590 650" stroke="#c9bf9f" stroke-opacity="0.25" stroke-width="3" fill="none" filter="url(#soft)"/>

  <!-- Dunes, far to near, with faint moonlit ridges -->
  <path d="M0 720 C 240 668 470 650 720 676 C 930 698 1080 662 1300 640 C 1540 616 1760 646 1920 680 L1920 1200 L0 1200 Z" fill="url(#d1)"/>
  <path d="M0 820 C 300 760 560 730 860 770 C 1100 802 1300 760 1520 736 C 1700 718 1830 742 1920 766 L1920 1200 L0 1200 Z" fill="url(#d2)"/>
  <path d="M1100 802 C 1300 760 1520 736 1700 718" stroke="#3b4646" stroke-opacity="0.6" stroke-width="2" fill="none"/>
  <path d="M0 930 C 260 880 520 852 760 880 C 1040 912 1260 860 1520 846 C 1720 836 1840 868 1920 892 L1920 1200 L0 1200 Z" fill="url(#d3)"/>
  <path d="M760 880 C 1040 912 1260 860 1520 846" stroke="#3e4848" stroke-opacity="0.55" stroke-width="2" fill="none"/>
  <path d="M0 1060 C 320 1000 640 984 940 1016 C 1240 1048 1520 1000 1920 990 L1920 1200 L0 1200 Z" fill="url(#d4)"/>
  <path d="M0 1060 C 320 1000 640 984 940 1016" stroke="#434d4d" stroke-opacity="0.5" stroke-width="2" fill="none"/>
</svg>
