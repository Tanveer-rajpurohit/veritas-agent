services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: veritas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas_password
      POSTGRES_DB: veritas
    ports:
      - "5432:5432"
    volumes:
      - veritas_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: veritas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: veritas
      MINIO_ROOT_PASSWORD: replace-with-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - veritas_minio_data:/data

volumes:
  veritas_pgdata:
  veritas_minio_data:
